<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVConnect Nova — ImpleVista IT India Pvt Ltd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tealL:#A9EADC; --teal:#5FD0BC; --tealM:#2FB8A4; --tealD:#1D9187; --tealX:#12665F;
  --purL:#D4AEE8; --pur:#A552C6; --purD:#7A1E9C; --purX:#4A0D63;
  --amber:#C98A0E; --rose:#C4324B;
  --fs:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Sora','Inter',system-ui,sans-serif;
  --r:22px; --rs:14px; --rx:10px; --rp:999px;
}
/* -- 1 Aurora : light teal wash into orchid -- */
[data-style="aurora"]{
  --canvas:radial-gradient(1200px 700px at 3% -8%, #C6F2E7 0%, transparent 56%),
           radial-gradient(1100px 680px at 99% 3%, #EBD9F6 0%, transparent 56%),
           linear-gradient(160deg,#EFFAF7 0%,#F7F1FB 100%);
  --shell:#FFFFFF; --card:#FFFFFF; --card2:#F4FCF9; --card3:#E7F6F2;
  --ink:#0E3430; --ink2:#456F68; --ink3:#4E7A72;
  --line:#DFF0EB; --line2:#EDF8F5;
  --rail:#11544E; --railink:#CFEDE5; --railink2:#8FBDB5;
  --ok:#0E7A63; --okbg:#DFF5EE; --warn:#8A5A00; --warnbg:#FAF0DA;
  --bad:#A62236; --badbg:#FBE7EA; --acc:#7A1E9C; --accbg:#F4E7FB;
  --sh:0 1px 2px rgba(14,84,78,.05),0 10px 28px rgba(14,84,78,.07);
  --shl:0 4px 12px rgba(14,84,78,.09),0 30px 70px rgba(14,84,78,.15);
  --aiG:linear-gradient(135deg,#12665F 0%,#1D9187 40%,#7A1E9C 100%);
}
/* -- 2 Frost : near-white, minimal -- */
[data-style="frost"]{
  --canvas:linear-gradient(160deg,#F4F8F8 0%,#F7F5FA 100%);
  --shell:#FFFFFF; --card:#FFFFFF; --card2:#F8FBFA; --card3:#EEF5F3;
  --ink:#13322F; --ink2:#486964; --ink3:#527771;
  --line:#E6EEEC; --line2:#F1F7F5;
  --rail:#FFFFFF; --railink:#5E807A; --railink2:#8AA8A2;
  --ok:#0E7A63; --okbg:#E1F5EF; --warn:#8A5A00; --warnbg:#FAF0DA;
  --bad:#A62236; --badbg:#FBE7EA; --acc:#7A1E9C; --accbg:#F4E7FB;
  --sh:0 1px 2px rgba(19,50,47,.04),0 6px 18px rgba(19,50,47,.05);
  --shl:0 4px 12px rgba(19,50,47,.07),0 26px 60px rgba(19,50,47,.12);
  --aiG:linear-gradient(135deg,#1D9187 0%,#2FB8A4 42%,#A552C6 100%);
}
[data-style="frost"] .rail{border-right:1px solid var(--line)}
[data-style="frost"] .rail .mark{box-shadow:none;border:1px solid var(--line)}
[data-style="frost"] .rb:hover{background:var(--card3);color:var(--ink)}
/* -- 3 Lagoon : teal led -- */
[data-style="lagoon"]{
  --canvas:radial-gradient(1300px 760px at 50% -14%, #BDEFE3 0%, transparent 58%),
           linear-gradient(165deg,#E7F7F3 0%,#EFF9F6 100%);
  --shell:#FFFFFF; --card:#FFFFFF; --card2:#F3FBF9; --card3:#E4F5F1;
  --ink:#08322C; --ink2:#3E6B63; --ink3:#4A756C;
  --line:#DBEFEA; --line2:#EAF7F4;
  --rail:#0C4E48; --railink:#C8EBE3; --railink2:#89BAB2;
  --ok:#0E7A63; --okbg:#DDF4ED; --warn:#8A5A00; --warnbg:#FAF0DA;
  --bad:#A62236; --badbg:#FBE7EA; --acc:#7A1E9C; --accbg:#F4E7FB;
  --sh:0 1px 2px rgba(8,50,44,.05),0 10px 26px rgba(8,50,44,.07);
  --shl:0 4px 12px rgba(8,50,44,.09),0 28px 66px rgba(8,50,44,.15);
  --aiG:linear-gradient(135deg,#0C4E48 0%,#1D9187 55%,#5FD0BC 100%);
}
/* -- 4 Orchid : purple led -- */
[data-style="orchid"]{
  --canvas:radial-gradient(1250px 740px at 96% -10%, #E9D4F6 0%, transparent 58%),
           linear-gradient(165deg,#F7F1FB 0%,#F1F8F6 100%);
  --shell:#FFFFFF; --card:#FFFFFF; --card2:#FBF7FD; --card3:#F2E9F7;
  --ink:#24103010; --ink:#241030; --ink2:#5A4568; --ink3:#655070;
  --line:#EBE0F1; --line2:#F4EDF7;
  --rail:#4A0D63; --railink:#E0C9EE; --railink2:#AE8FBE;
  --ok:#0E7A63; --okbg:#E1F5EF; --warn:#8A5A00; --warnbg:#FAF0DA;
  --bad:#A62236; --badbg:#FBE7EA; --acc:#7A1E9C; --accbg:#F3E5FA;
  --sh:0 1px 2px rgba(74,13,99,.05),0 10px 28px rgba(74,13,99,.08);
  --shl:0 4px 12px rgba(74,13,99,.10),0 30px 70px rgba(74,13,99,.18);
  --aiG:linear-gradient(135deg,#4A0D63 0%,#7A1E9C 48%,#2FB8A4 100%);
}
/* -- 5 Midnight : deep teal dark -- */
[data-style="midnight"]{
  --canvas:radial-gradient(1200px 700px at 4% -8%, #10403B 0%, transparent 55%),
           radial-gradient(1100px 680px at 98% 4%, #33124A 0%, transparent 55%),
           linear-gradient(160deg,#04110F 0%,#0A0715 100%);
  --shell:#0B1B19; --card:#102421; --card2:#152D29; --card3:#1D3B36;
  --ink:#E9FAF5; --ink2:#A8CFC7; --ink3:#8FB5AD;
  --line:#1E3B36; --line2:#17302C;
  --rail:#05120F; --railink:#BFE6DC; --railink2:#7AA9A1;
  --ok:#5FE0BC; --okbg:rgba(95,224,188,.14); --warn:#EAB55C; --warnbg:rgba(234,181,92,.14);
  --bad:#FF8A9B; --badbg:rgba(255,138,155,.14); --acc:#D4AEE8; --accbg:rgba(212,174,232,.16);
  --sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.38);
  --shl:0 4px 14px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.55);
  --aiG:linear-gradient(135deg,#0C3A35 0%,#1D9187 48%,#7A1E9C 100%);
}
/* -- 6 Carbon : neutral dark -- */
[data-style="carbon"]{
  --canvas:linear-gradient(160deg,#101214 0%,#15131A 100%);
  --shell:#191C1F; --card:#1F2327; --card2:#252A2E; --card3:#2E343A;
  --ink:#F0F4F5; --ink2:#B4C0C4; --ink3:#8996 9C; --ink3:#9AA7AD;
  --line:#2E3438; --line2:#262B2F;
  --rail:#0E1012; --railink:#C6D2D5; --railink2:#87949A;
  --ok:#5FE0BC; --okbg:rgba(95,224,188,.14); --warn:#EAB55C; --warnbg:rgba(234,181,92,.14);
  --bad:#FF8A9B; --badbg:rgba(255,138,155,.14); --acc:#D4AEE8; --accbg:rgba(212,174,232,.16);
  --sh:0 1px 2px rgba(0,0,0,.45),0 12px 30px rgba(0,0,0,.4);
  --shl:0 4px 14px rgba(0,0,0,.5),0 28px 64px rgba(0,0,0,.55);
  --aiG:linear-gradient(135deg,#17322F 0%,#2FB8A4 46%,#A552C6 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);background-attachment:fixed;color:var(--ink);font-family:var(--fs);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;padding:14px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
table{border-collapse:collapse;width:100%}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:6px}

/* floating shell */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0;
  background:var(--shell);border-radius:var(--r);box-shadow:var(--shl);overflow:hidden;
  min-height:calc(100vh - 28px)}

/* icon rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 16px}
.rail .mark{background:#fff;border-radius:13px;padding:7px;margin-bottom:16px;display:grid;place-items:center;
  width:46px;height:46px;box-shadow:0 3px 12px rgba(0,0,0,.28)}
.rail .mark img{width:30px;height:30px;display:block}
.hdr .wm{display:inline-block;margin-bottom:9px;border-radius:9px;line-height:0}
[data-style="midnight"] .hdr .wm,[data-style="carbon"] .hdr .wm{background:#fff;padding:6px 9px}
.hdr .wm img{height:28px;width:auto;display:block}
.rb{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--railink);position:relative}
.rb:hover{background:rgba(255,255,255,.1);color:#fff}
.rb.on{background:linear-gradient(140deg,var(--tealM),var(--purD));color:#fff;
  box-shadow:0 6px 18px rgba(122,30,156,.38)}
.rb svg{width:21px;height:21px}
.rb .pip{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;
  background:var(--purL);box-shadow:0 0 0 2.5px var(--rail)}
.rb .tip{position:absolute;left:58px;white-space:nowrap;background:var(--rail);color:#fff;
  padding:5px 10px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;
  transform:translateX(-6px);transition:.14s;z-index:30;box-shadow:var(--sh)}
.rb:hover .tip{opacity:1;transform:translateX(0)}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}

/* main */
.main{padding:22px 26px 34px;min-width:0}
.hdr{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{font-family:var(--fd);font-size:25px;font-weight:600;letter-spacing:-.7px;line-height:1.2}
.hdr .sub{font-size:13px;color:var(--ink2);margin-top:3px}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.seg{display:inline-flex;background:var(--card3);border-radius:var(--rp);padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:var(--rp);font-size:12.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}

.stack{display:flex;align-items:center}
.stack img,.stack .av{width:30px;height:30px;border-radius:50%;margin-left:-9px;
  border:2.5px solid var(--shell);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.stack .av:first-child{margin-left:0}
.stack .more{background:var(--card3);color:var(--ink2)}
.stylesel select{font:inherit;font-size:12.5px;padding:8px 11px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}

.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink2);background:var(--card);position:relative}
.ib:hover{border-color:var(--teal);color:var(--ink)}
.ib .pip{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.btn{padding:9px 17px;border-radius:var(--rp);font-size:13.5px;font-weight:500;
  border:1px solid var(--line);color:var(--ink);background:var(--card);white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.p{background:linear-gradient(130deg,var(--tealD),var(--purD));color:#fff;border-color:transparent;font-weight:600}
.btn.p:hover{filter:brightness(1.12)}
.btn.s{padding:6px 13px;font-size:12.5px}
.btn.g{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.g:hover{background:var(--card3);color:var(--ink)}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 18px}
.chip{padding:6px 13px;border-radius:var(--rp);font-size:12.5px;border:1px solid var(--line);
  color:var(--ink2);background:var(--card);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--teal);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--shell);border-color:var(--ink);font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;display:block}

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
.c9{grid-column:span 9}.c12{grid-column:span 12}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:18px 18px 20px;
  min-width:0;position:relative;overflow:hidden}
.k:hover{border-color:var(--line)}
.kh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kh h3{font-family:var(--fd);font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.kh .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.kh .lnk{font-size:12.5px;color:var(--tealD);font-weight:600}
.kh .lnk:hover{text-decoration:underline}

/* kpi */
.kpi .lb{font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .lb i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.kpi .lb i svg{width:14px;height:14px}
.kpi .v{font-family:var(--fd);font-size:31px;font-weight:600;letter-spacing:-1.4px;line-height:1.05;margin:11px 0 6px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:-.2px}
.kpi .ft{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);
  position:relative;z-index:1}
.dl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:2px 8px;border-radius:var(--rp)}
.dl.u{background:var(--okbg);color:var(--ok)}.dl.d{background:var(--badbg);color:var(--bad)}
.dl.f{background:var(--card3);color:var(--ink2)}
.kspark{position:absolute;right:0;bottom:0;width:46%;height:38px;opacity:.55;pointer-events:none}

/* table */
.tb{font-size:13px}
.tb th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;padding:0 10px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.tb td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--ink2)}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr:hover{background:var(--card2)}
.tb .r{text-align:right}.tb .s{font-weight:600;color:var(--ink)}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
.who b{font-weight:600;color:var(--ink);display:block;font-size:13px;line-height:1.3}
.who span{font-size:11.5px;color:var(--ink2)}
.mini{height:6px;border-radius:4px;background:var(--card3);overflow:hidden;min-width:70px}
.mini i{display:block;height:100%;border-radius:4px}

.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--rp);
  font-size:11.5px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.wn{background:var(--warnbg);color:var(--warn)}
.tag.bd{background:var(--badbg);color:var(--bad)}.tag.ac{background:var(--accbg);color:var(--acc)}
.tag.mu{background:var(--card3);color:var(--ink2)}

/* AI panel */
.k.ai{background:var(--aiG);
  border-color:transparent;color:#fff}
.k.ai::after{content:"";position:absolute;right:-60px;top:-80px;width:250px;height:250px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.k.ai .kh h3{color:#fff}
.k.ai p{font-size:15px;line-height:1.62;position:relative;z-index:1;color:rgba(255,255,255,.95)}
.k.ai em{font-style:normal;font-weight:600;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:6px}
.k.ai .meta{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:14px;position:relative;z-index:1}
.aip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;
  border-radius:var(--rp);background:rgba(255,255,255,.2);margin-left:auto}
.aip i{width:6px;height:6px;border-radius:50%;background:#7DF0C8;display:block}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{position:relative;padding:9px 0}
.ti::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;
  background:var(--teal);border:2.5px solid var(--card)}
.ti.a::before{background:var(--acc)}.ti.w::before{background:var(--amber)}
.ti .t{font-size:13px;line-height:1.5;color:var(--ink2)}
.ti .t b{color:var(--ink);font-weight:600}
.ti .w2{font-size:11.5px;color:var(--ink2);margin-top:2px}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:0}
.cols{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dlist{display:flex;flex-direction:column;gap:11px;flex:1;min-width:150px}
.dl2{display:flex;align-items:center;gap:10px;font-size:13px}
.dl2 i{width:9px;height:9px;border-radius:3px;flex:none}
.dl2 b{margin-left:auto;font-weight:600;color:var(--ink)}

@media(max-width:1250px){
  .c3{grid-column:span 6}.c4,.c5{grid-column:span 6}
  .c7,.c8,.c9{grid-column:span 12}
}
@media(max-width:820px){
  body{padding:8px}
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;padding:10px;overflow-x:auto}
  .rail .mark{margin:0 10px 0 0}
  .rail .foot{margin-top:0;flex-direction:row}
  .rb .tip{display:none}
  .grid>*{grid-column:span 12 !important}
  .main{padding:16px 14px 26px}
}
@media(prefers-reduced-motion:no-preference){.rb,.btn,.chip,.ib{transition:all .14s ease}}
</style>
</head>

const ic=(k,w=21)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor"
 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${I[k]||I.grid}"/></svg>`;
const uid=()=>'x'+Math.random().toString(36).slice(2,8);

/* ---------- charts ---------- */
function area(series,labels,h=210){
  const w=760,pl=42,pr=12,pt=14,pb=26;
  const all=series.flatMap(s=>s.v); const mx=Math.max(...all)*1.12, mn=0;
  const X=i=>pl+i*((w-pl-pr)/(labels.length-1));
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
  const ticks=4;
  let g='';
  for(let t=0;t<=ticks;t++){const v=mn+(mx-mn)*t/ticks,y=Y(v);
    g+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${pl-9}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink3)">${Math.round(v)}</text>`;}
  let paths='';
  series.forEach(s=>{
    const id=uid();
    const pts=s.v.map((v,i)=>[X(i),Y(v)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    paths+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${s.c}" stop-opacity=".30"/>
      <stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs>
     <path d="${d} L ${X(labels.length-1).toFixed(1)} ${Y(mn)} L ${pl} ${Y(mn)} Z" fill="url(#${id})"/>
     <path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
     ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--card)" stroke="${s.c}" stroke-width="2"/>`).join('')}`;
  });
  const xl=labels.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" role="img">${g}${paths}${xl}</svg>`;
}
function donut(parts,total,label){
  const R=62,C=2*Math.PI*R; let off=0;
  const arcs=parts.map(p=>{const len=C*(p.v/total);
    const s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${p.c}" stroke-width="20"
      stroke-dasharray="${len-3} ${C-len+3}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`;
    off+=len; return s;}).join('');
  return `<div class="cols"><svg width="160" height="160" viewBox="0 0 160 160" style="flex:none">
    <g transform="rotate(-90 80 80)"><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--card3)" stroke-width="20"/>${arcs}</g>
    <text x="80" y="76" text-anchor="middle" font-family="Sora,Inter" font-size="26" font-weight="600"
      letter-spacing="-1" fill="var(--ink)">${label[0]}</text>
    <text x="80" y="95" text-anchor="middle" font-size="11" fill="var(--ink3)">${label[1]}</text></svg>
   <div class="dlist">${parts.map(p=>`<div class="dl2"><i style="background:${p.c}"></i>
     <span>${p.n}</span><b class="n">${p.v}</b></div>`).join('')}</div></div>`;
}
function vbars(data,h=200){
  const w=560,pl=36,pb=28,pt=12,mx=Math.max(...data.map(d=>d.v))*1.15;
  const bw=(w-pl-10)/data.length;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
   ${[0,1,2,3].map(t=>{const y=pt+(t/3)*(h-pt-pb);
     return `<line x1="${pl}" y1="${y}" x2="${w-6}" y2="${y}" stroke="var(--line)"/>`}).join('')}
   ${data.map((d,i)=>{const bh=(d.v/mx)*(h-pt-pb),x=pl+i*bw+bw*.22,y=h-pb-bh;
     return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${bh.toFixed(1)}"
       rx="6" fill="${d.c}"/>
      <text x="${(x+bw*.28).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="11"
        font-weight="600" fill="var(--ink)">${d.v}</text>
      <text x="${(x+bw*.28).toFixed(1)}" y="${h-9}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${d.l}</text>`}).join('')}
  </svg>`;
}
function kspark(v,c){
  const w=300,h=46,mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  const p=v.map((x,i)=>[i*(w/(v.length-1)),h-4-((x-mn)/r)*(h-12)]);
  const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const id=uid();
  return `<svg class="kspark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${c}" stop-opacity=".26"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
   <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/>
   <path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
}
